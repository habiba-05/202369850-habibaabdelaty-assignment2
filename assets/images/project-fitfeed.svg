<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="fitfeedTitle">
  <title id="fitfeedTitle">Fitfeed app preview</title>
  <rect width="600" height="400" fill="#F3D9DF"/>

  <!-- phone frame -->
  <rect x="210" y="34" width="180" height="332" rx="28" fill="#FBF3F0" stroke="#C6547A" stroke-width="2"/>
  <rect x="210" y="34" width="180" height="46" rx="28" fill="#C6547A"/>
  <rect x="210" y="60" width="180" height="20" fill="#C6547A"/>
  <text x="300" y="63" text-anchor="middle" font-family="'Space Mono', monospace" font-size="12" fill="#FBF3F0">fitfeed</text>

  <!-- activity rings -->
  <circle cx="300" cy="150" r="42" fill="none" stroke="#ECE5F5" stroke-width="10"/>
  <circle cx="300" cy="150" r="42" fill="none" stroke="#8A6FA8" stroke-width="10" stroke-dasharray="205 264" stroke-linecap="round" transform="rotate(-90 300 150)"/>
  <circle cx="300" cy="150" r="28" fill="none" stroke="#ECE5F5" stroke-width="8"/>
  <circle cx="300" cy="150" r="28" fill="none" stroke="#C6547A" stroke-width="8" stroke-dasharray="120 176" stroke-linecap="round" transform="rotate(-90 300 150)"/>

  <!-- AI suggestion chip -->
  <rect x="230" y="216" width="140" height="46" rx="14" fill="#ECE5F5"/>
  <text x="300" y="235" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="#8A6FA8">AI suggestion</text>
  <text x="300" y="252" text-anchor="middle" font-family="Manrope, sans-serif" font-size="11" fill="#2B1B22">+10 min walk today</text>

  <!-- mini stat rows -->
  <rect x="230" y="278" width="140" height="10" rx="5" fill="#E7B6C4"/>
  <rect x="230" y="298" width="100" height="10" rx="5" fill="#E7B6C4"/>

  <rect x="230" y="326" width="140" height="30" rx="15" fill="#C6547A"/>
  <text x="300" y="346" text-anchor="middle" font-family="Manrope, sans-serif" font-size="12" fill="#FBF3F0">Log workout</text>

  <!-- floating heart icon, fitness accent -->
  <path d="M110,150c-10-14-32-8-32,10c0,16,20,28,32,38c12-10,32-22,32-38C142,142,120,136,110,150Z" fill="#C6547A" opacity="0.85"/>
</svg>
