<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="wiperTitle">
  <title id="wiperTitle">Wiper Trip AI Prediction dashboard preview</title>
  <rect width="600" height="400" fill="#ECE5F5"/>
  <rect x="40" y="40" width="520" height="320" rx="18" fill="#FBF3F0" stroke="#8A6FA8" stroke-width="2"/>
  <rect x="40" y="40" width="520" height="50" rx="18" fill="#8A6FA8"/>
  <rect x="40" y="70" width="520" height="20" fill="#8A6FA8"/>
  <text x="64" y="70" font-family="'Space Mono', monospace" font-size="14" fill="#FBF3F0">wiper-trip / well-report</text>

  <!-- risk gauge -->
  <g transform="translate(150,220)">
    <path d="M-80,0 A80,80 0 0 1 80,0" fill="none" stroke="#ECE5F5" stroke-width="16" stroke-linecap="round"/>
    <path d="M-80,0 A80,80 0 0 1 30,-74" fill="none" stroke="#C6547A" stroke-width="16" stroke-linecap="round"/>
    <text x="0" y="-10" text-anchor="middle" font-family="'Space Mono', monospace" font-size="22" fill="#2B1B22">72%</text>
    <text x="0" y="14" text-anchor="middle" font-family="Manrope, sans-serif" font-size="11" fill="#6B5560">wiper trip risk</text>
  </g>

  <!-- bar chart of well readings -->
  <g>
    <rect x="330" y="220" width="20" height="80" rx="4" fill="#E7B6C4"/>
    <rect x="360" y="190" width="20" height="110" rx="4" fill="#E7B6C4"/>
    <rect x="390" y="150" width="20" height="150" rx="4" fill="#C6547A"/>
    <rect x="420" y="200" width="20" height="100" rx="4" fill="#E7B6C4"/>
    <rect x="450" y="170" width="20" height="130" rx="4" fill="#E7B6C4"/>
    <rect x="480" y="140" width="20" height="160" rx="4" fill="#C6547A"/>
    <line x1="320" y1="300" x2="520" y2="300" stroke="#8A6FA8" stroke-width="2"/>
  </g>
  <text x="330" y="318" font-family="Manrope, sans-serif" font-size="11" fill="#6B5560">torque &amp; drag readings by depth</text>
</svg>
